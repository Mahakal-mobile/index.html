<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Guru AI – Nikesh Pandey (Direct Mode)</title>
  
  <style>
    :root {
      --bg: #070a13;
      --surface: #0f1524;
      --surface2: #1e2942;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --primary: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --border: #1e293b;
      --radius: 16px;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    
    /* App Interface */
    #app-content { display: flex; flex-direction: column; flex: 1; padding: 16px; height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .logo { font-weight: 700; font-size: 1.2rem; color: var(--text); }
    .logo span { color: var(--primary); }
    .status-badge { background: var(--surface2); padding: 6px 14px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; color: var(--primary); }
    
    /* Configuration Cards */
    .panel-card { background: var(--surface); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); margin-top: 14px; }
    .panel-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    
    .switch-box { display: flex; justify-content: space-between; align-items: center; }
    .switch-label { font-weight: 600; font-size: 0.95rem; }
    .switch-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    
    /* Action & Log Terminal */
    #terminal-container { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 14px; }
    #agent-log { flex: 1; background: #02040a; border-radius: var(--radius); padding: 14px; font-family: monospace; font-size: 0.9rem; overflow-y: auto; border: 1px solid var(--border); line-height: 1.4; }
    .log-row { margin-bottom: 8px; word-wrap: break-word; }
    .log-system { color: var(--text-muted); }
    .log-user { color: var(--primary); font-weight: 600; }
    .log-agent { color: var(--success); }
    .log-alert { color: var(--danger); font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 6px; border-radius: 6px; border-left: 3px solid var(--danger); }
    
    /* Permission UI / Interactive Area */
    #action-tray { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); margin-top: 12px; padding: 14px; display: none; transform: translateY(10px); transition: 0.3s ease; }
    .tray-title { font-size: 0.95rem; font-weight: 600; margin-bottom: 6px; color: var(--primary); }
    .tray-preview { background: var(--bg); padding: 10px; border-radius: 8px; font-size: 0.9rem; border: 1px solid var(--border); margin-bottom: 12px; white-space: pre-wrap; color: #e2e8f0; }
    .tray-buttons { display: flex; gap: 10px; }
    .action-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; }
    .action-btn.send { background: var(--success); color: #070a13; }
    .action-btn.edit { background: var(--surface2); color: var(--text); }
    .action-btn.cancel { background: var(--danger); color: white; }
    
    /* Footer Layout & Control Bubble */
    .controls-wrapper { display: flex; justify-content: center; align-items: center; padding: 16px 0; }
    .mic-bubble { width: 68px; height: 68px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); color: var(--text); font-size: 1.6rem; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: 0.2s; }
    .mic-bubble.listening { background: var(--danger); border-color: var(--danger); box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); transform: scale(1.05); }
  </style>
</head>
<body>

  <!-- 📱 Main AI Agent Dashboard (No Lock Screen) -->
  <div id="app-content">
    <header>
      <div class="logo">Guru AI <span>✦</span></div>
      Nikesh Pandey</div>
    </header>

    <!-- 🔑 Internal Secret API Vault Card -->
    <div class="panel-card">
      <h3>🔐 Internal Vault (Secure API Key Box)</h3>
      <input type="password" id="secure-key-vault" placeholder="Enter your AI API Key here..." style="width:100%; padding:12px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:white; font-size:0.9rem;" onchange="storeEncryptedKey()" />
    </div>

    <!-- 🎛️ Master On/Off Switch -->
    <div class="panel-card switch-box">
      <div>
        <div class="switch-label">Auto SMS & System Operate</div>
        <div class="switch-sub">Background voice and fraud monitoring mode</div>
      </div>
      <input type="checkbox" id="master-agent-toggle" style="width:26px; height:26px; accent-color:var(--primary);" onchange="handleAgentStateChange()" checked />
    </div>

    <!-- 🖥️ Live Terminal Log Dashboard -->
    <div id="terminal-container">
      <div id="agent-log">
        <div class="log-row log-system">[SYSTEM]: Security shields active. Guru AI initialized. Awaiting orders...</div>
      </div>
    </div>

    <!-- 🤝 Human-In-The-Loop User Permission Window (Send / Edit) -->
    <div id="action-tray">
      <div class="tray-title" id="tray-action-type">AI Generated Task Blueprint:</div>
      <div class="tray-preview" id="tray-text-preview" contenteditable="true">Message draft payload will load here...</div>
      <div class="tray-buttons">
        <button class="action-btn edit" onclick="enableManualEdit()">📝 Modify</button>
        <button class="action-btn cancel" onclick="denyOperation()">✕ Discard</button>
        <button class="action-btn send" onclick="approveOperation()">➤ Approve (Send)</button>
      </div>
    </div>

    <!-- 🎙️ Voice Agent Capture Hub -->
    <div class="controls-wrapper">
      <button class="mic-bubble" id="agent-voice-bubble" onclick="toggleVoiceAgent()">🎤</button>
    </div>
  </div>

  <script>
    let currentDraftMode = null;
    let pendingData = "";

    // Welcome Trigger on Application Boot
    window.addEventListener('load', () => {
      retrieveSavedKey();
      writeLog("Full smartphone control framework assigned to Nikesh Pandey.", "agent");
      triggerVoiceResponse("Welcome Nikesh Pandey ji. Guru A I full system control is active. Please give your command.");
    });

    function storeEncryptedKey() {
      const keyVal = document.getElementById("secure-key-vault").value;
      localStorage.setItem("guru_vault_key", btoa(keyVal)); 
      writeLog("API Key successfully encrypted and locked into Internal Vault.", "system");
    }

    function retrieveSavedKey() {
      const stored = localStorage.getItem("guru_vault_key");
      if (stored) {
        document.getElementById("secure-key-vault").value = atob(stored);
      }
    }

    function writeLog(message, origin = "system") {
      const logBox = document.getElementById("agent-log");
      const row = document.createElement("div");
      row.className = "log-row log-" + origin;
      
      if(origin === "system") row.textContent = `[SYSTEM]: ${message}`;
      else if(origin === "user") row.textContent = `[NIKESH]: ${message}`;
      else if(origin === "agent") row.textContent = `[GURU AI]: ${message}`;
      else if(origin === "alert") row.textContent = `[🚨 FRAUD ALERT]: ${message}`;
      
      logBox.appendChild(row);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function triggerVoiceResponse(speechText) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = "hi-IN"; // Speaks in clear Hindi accent for you
      window.speechSynthesis.speak(utterance);
    }

    // ================= Native Web Speech Recognition Pipeline =================
    const VoiceRecognitionEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
    let voiceSession = null;
    let isSpeechActive = false;

    if (VoiceRecognitionEngine) {
      voiceSession = new VoiceRecognitionEngine();
      voiceSession.continuous = true;
      voiceSession.interimResults = false;
      voiceSession.lang = "hi-IN"; // Recognizes Hindi/Hinglish speech input perfectly

      voiceSession.onresult = (event) => {
        const lastResultIndex = event.results.length - 1;
        if (event.results[lastResultIndex].isFinal) {
          const rawCommand = event.results[lastResultIndex].transcript.trim();
          writeLog(rawCommand, "user");
          evaluateAgentIntelligence(rawCommand);
        }
      };

      voiceSession.onend = () => {
        if (isSpeechActive && document.getElementById("master-agent-toggle").checked) {
          try { voiceSession.start(); } catch(e) {}
        }
      };
    }

    function toggleVoiceAgent() {
      if (!voiceSession) return alert("Voice speech engine is unsupported on this mobile browser architecture.");
      
      const btn = document.getElementById("agent-voice-bubble");
      if (isSpeechActive) {
        isSpeechActive = false;
        voiceSession.stop();
        btn.classList.remove("listening");
        writeLog("Voice transmission stream deactivated.", "system");
      } else {
        isSpeechActive = true;
        voiceSession.start();
